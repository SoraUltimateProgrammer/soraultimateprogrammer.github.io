<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Information CPU</title>
    <style>
        :root {
            --hud-blue: #00f3ff;
            --hud-bg: #030a14;
            --hud-panel: rgba(0, 243, 255, 0.05);
            --hud-border: rgba(0, 243, 255, 0.3);
            --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        body {
            background-color: var(--hud-bg);
            color: var(--hud-blue);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--hud-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-shadow: var(--text-glow);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            animation: titleGlow 2.5s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow:
                    0 0 5px rgba(0, 243, 255, 0.35),
                    0 0 10px rgba(0, 243, 255, 0.25);
            }
            50% {
                text-shadow:
                    0 0 10px rgba(0, 243, 255, 0.8),
                    0 0 25px rgba(0, 243, 255, 0.65),
                    0 0 40px rgba(0, 243, 255, 0.4);
            }
        }

        p.subtitle { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.8; }

        /* Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .hud-btn {
            background: var(--hud-panel);
            border: 1px solid var(--hud-blue);
            color: var(--hud-blue);
            padding: 10px 16px;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: var(--hud-blue);
            color: var(--hud-bg);
            box-shadow: var(--text-glow);
        }

        .dropdown-content {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            background-color: var(--hud-bg);
            border: 1px solid var(--hud-border);
            box-shadow: 0px 8px 16px rgba(0, 243, 255, 0.2);
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scaleY(0.9);
            transform-origin: top;
            transition: opacity 0.2s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        .dropdown-content button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            color: var(--hud-blue);
            padding: 12px 16px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease, padding-left 0.15s ease, box-shadow 0.15s ease;
        }

        .dropdown-content button:hover {
            background: var(--hud-panel);
            padding-left: 22px;
            box-shadow: inset 3px 0 0 var(--hud-blue), 0 0 10px rgba(0, 243, 255, 0.15);
        }

        .dropdown.active .dropdown-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scaleY(1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 10, 20, 0.85);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--hud-bg);
            border: 1px solid var(--hud-blue);
            margin: 6% auto;
            padding: 20px;
            width: 90%;
            max-width: 520px;
            box-shadow: var(--text-glow);
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-modal {
            color: var(--hud-blue);
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover { opacity: 0.7; }

        .modal-content input,
        .modal-content button.submit-btn {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: 1px solid var(--hud-blue);
            color: var(--hud-blue);
            padding: 10px;
            margin: 8px 0;
            font-family: inherit;
            outline: none;
        }

        .modal-content label {
            display: block;
            font-size: 0.75rem;
            opacity: 0.75;
            margin-top: 10px;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .modal-content button.submit-btn:hover {
            background: var(--hud-blue);
            color: var(--hud-bg);
            box-shadow: var(--text-glow);
            cursor: pointer;
        }

        /* Source list (Modify Streams) */
        .source-list {
            margin-top: 15px;
        }

        .source-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border: 1px solid var(--hud-border);
            margin-bottom: 8px;
            background: var(--hud-panel);
            gap: 10px;
        }

        .source-item-info {
            flex: 1;
            min-width: 0;
        }

        .source-item-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .source-item-url {
            font-size: 0.7rem;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .source-item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .source-item-actions button {
            background: transparent;
            border: 1px solid var(--hud-blue);
            color: var(--hud-blue);
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .source-item-actions button:hover {
            background: var(--hud-blue);
            color: var(--hud-bg);
        }

        .source-item-actions button.delete-btn:hover {
            background: #ff3366;
            border-color: #ff3366;
            color: #fff;
        }

        .empty-list {
            text-align: center;
            opacity: 0.6;
            padding: 30px 10px;
            font-size: 0.9rem;
        }

        /* Feed */
        #feed-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            flex: 1;
        }

        .news-card {
            background: var(--hud-panel);
            border: 1px solid var(--hud-border);
            padding: 15px;
            transition: all 0.3s ease;
        }

        .news-card:hover {
            border-color: var(--hud-blue);
            box-shadow: var(--text-glow);
        }

        .news-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid var(--hud-border);
            margin-bottom: 10px;
        }

        .news-card h3 {
            font-size: 1rem;
            margin: 0 0 10px 0;
        }

        .news-card a {
            color: var(--hud-blue);
            text-decoration: none;
        }

        .news-card a:hover {
            text-decoration: underline;
        }

        .source-tag {
            font-size: 0.75rem;
            opacity: 0.7;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid var(--hud-border);
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>THE INFORMATION CPU</h1>
            <p class="subtitle">[SYSTEM STATUS: ONLINE // PROTOCOL: DEFAULT]</p>
        </div>
        
        <div class="dropdown" id="control-dropdown">
            <button class="hud-btn" onclick="toggleDropdown()">SYSTEM COMMANDS ▼</button>
            <div class="dropdown-content">
                <button onclick="openAddModal()">+ Add New Stream</button>
                <button onclick="openModifyModal()">⚙ Modify Streams</button>
                <button onclick="alert('Module offline: QR import coming soon.')">📷 Import via QR</button>
            </div>
        </div>
    </header>

    <!-- ADD NEW STREAM MODAL -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('add-modal')">&times;</span>
            <h3>// INITIALIZE NEW STREAM</h3>
            <form id="source-form">
                <label>Source Name</label>
                <input type="text" id="source-name" placeholder="e.g., TechCrunch" required>

                <label>API / Feed URL</label>
                <input type="url" id="source-url" placeholder="API/Feed GET Request URL" required>

                <label>Title Element</label>
                <input type="text" id="title-element" placeholder="e.g., title" required>

                <label>Description Element</label>
                <input type="text" id="description-element" placeholder="e.g., description" required>

                <label>Link Element</label>
                <input type="text" id="link-element" placeholder="e.g., link or url" required>

                <label>Thumbnail Element</label>
                <input type="text" id="thumbnail-element" placeholder="e.g., image or thumbnail" required>

                <button type="submit" class="submit-btn">EXECUTE STREAM LINK</button>
            </form>
        </div>
    </div>

    <!-- MODIFY STREAMS MODAL (list) -->
    <div id="modify-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('modify-modal')">&times;</span>
            <h3>// MODIFY STREAMS</h3>
            <div id="source-list" class="source-list">
                <!-- populated by JS -->
            </div>
        </div>
    </div>

    <!-- EDIT STREAM MODAL -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('edit-modal')">&times;</span>
            <h3>// EDIT STREAM</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-id">

                <label>Source Name</label>
                <input type="text" id="edit-name" required>

                <label>API / Feed URL</label>
                <input type="url" id="edit-url" required>

                <label>Title Element</label>
                <input type="text" id="edit-title-element" required>

                <label>Description Element</label>
                <input type="text" id="edit-description-element" required>

                <label>Link Element</label>
                <input type="text" id="edit-link-element" required>

                <label>Thumbnail Element</label>
                <input type="text" id="edit-thumbnail-element" required>

                <button type="submit" class="submit-btn">UPDATE STREAM</button>
            </form>
        </div>
    </div>

    <div id="feed-container"></div>

    <footer>
        [CURRENT VERSION: ALPHA-6]
    </footer>

    <script>
        const AWS_API_ENDPOINT = "https://knv6hozwnf.execute-api.us-east-1.amazonaws.com/fetch";
        let db;

        // ---------- UI helpers ----------
        function toggleDropdown() {
            document.getElementById('control-dropdown').classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.hud-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('active')) {
                        dropdowns[i].classList.remove('active');
                    }
                }
            }
        }

        function openAddModal() {
            document.getElementById('add-modal').style.display = "block";
        }

        function openModifyModal() {
            renderSourceList();
            document.getElementById('modify-modal').style.display = "block";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        // ---------- IndexedDB ----------
        const request = indexedDB.open("InformationCPUDB", 1);
        
        request.onerror = (event) => console.error("IndexedDB error:", event.target.error);
        
        request.onsuccess = (event) => {
            db = event.target.result;
            initializeApp();
        };

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains("sources")) {
                db.createObjectStore("sources", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("articles")) {
                const articleStore = db.createObjectStore("articles", { keyPath: "id", autoIncrement: true });
                articleStore.createIndex("sourceId", "sourceId", { unique: false });
            }
        };

        async function initializeApp() {
            // 1. Render instantly from existing local DB (prevents flickering/delay)
            renderInterleavedFeed();
            
            // 2. Perform background checks/fetches silently without wiping UI first
            await syncSourcesAndFetch();
            
            // 3. Re-render once fresh data arrives
            renderInterleavedFeed();
        }

        // ---------- Add source ----------
        document.getElementById('source-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const source = {
                name: document.getElementById('source-name').value.trim(),
                url: document.getElementById('source-url').value.trim(),
                titleElement: document.getElementById('title-element').value.trim(),
                descriptionElement: document.getElementById('description-element').value.trim(),
                linkElement: document.getElementById('link-element').value.trim(),
                thumbnailElement: document.getElementById('thumbnail-element').value.trim(),
                lastChecked: 0
            };

            const tx = db.transaction(["sources"], "readwrite");
            tx.objectStore("sources").add(source);

            tx.oncomplete = () => {
                document.getElementById('source-form').reset();
                closeModal('add-modal');
                initializeApp();
            };
        });

        // ---------- Modify / Edit / Delete ----------
        function renderSourceList() {
            const listEl = document.getElementById('source-list');
            listEl.innerHTML = "";

            const tx = db.transaction(["sources"], "readonly");
            tx.objectStore("sources").getAll().onsuccess = (e) => {
                const sources = e.target.result;

                if (sources.length === 0) {
                    listEl.innerHTML = `<div class="empty-list">No streams configured.<br>Use “+ Add New Stream” to begin.</div>`;
                    return;
                }

                sources.forEach(source => {
                    const item = document.createElement('div');
                    item.className = "source-item";
                    item.innerHTML = `
                        <div class="source-item-info">
                            <div class="source-item-name">${escapeHtml(source.name)}</div>
                            <div class="source-item-url">${escapeHtml(source.url)}</div>
                        </div>
                        <div class="source-item-actions">
                            <button onclick="openEditModal(${source.id})">Edit</button>
                            <button class="delete-btn" onclick="deleteSource(${source.id}, '${escapeHtml(source.name)}')">Delete</button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            };
        }

        function openEditModal(id) {
            const tx = db.transaction(["sources"], "readonly");
            tx.objectStore("sources").get(id).onsuccess = (e) => {
                const source = e.target.result;
                if (!source) return;

                document.getElementById('edit-id').value = source.id;
                document.getElementById('edit-name').value = source.name || "";
                document.getElementById('edit-url').value = source.url || "";
                document.getElementById('edit-title-element').value = source.titleElement || "";
                document.getElementById('edit-description-element').value = source.descriptionElement || "";
                document.getElementById('edit-link-element').value = source.linkElement || "";
                document.getElementById('edit-thumbnail-element').value = source.thumbnailElement || "";

                closeModal('modify-modal');
                document.getElementById('edit-modal').style.display = "block";
            };
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = Number(document.getElementById('edit-id').value);

            const tx = db.transaction(["sources"], "readwrite");
            const store = tx.objectStore("sources");

            store.get(id).onsuccess = (ev) => {
                const source = ev.target.result;
                if (!source) return;

                const oldUrl = source.url;
                const oldMappings = JSON.stringify({
                    t: source.titleElement,
                    d: source.descriptionElement,
                    l: source.linkElement,
                    th: source.thumbnailElement
                });

                source.name = document.getElementById('edit-name').value.trim();
                source.url = document.getElementById('edit-url').value.trim();
                source.titleElement = document.getElementById('edit-title-element').value.trim();
                source.descriptionElement = document.getElementById('edit-description-element').value.trim();
                source.linkElement = document.getElementById('edit-link-element').value.trim();
                source.thumbnailElement = document.getElementById('edit-thumbnail-element').value.trim();

                const newMappings = JSON.stringify({
                    t: source.titleElement,
                    d: source.descriptionElement,
                    l: source.linkElement,
                    th: source.thumbnailElement
                });

                if (source.url !== oldUrl || newMappings !== oldMappings) {
                    source.lastChecked = 0;
                }

                store.put(source);
            };

            tx.oncomplete = async () => {
                await clearArticlesForSource(id);
                closeModal('edit-modal');
                initializeApp();
            };
        });

        async function deleteSource(id, name) {
            if (!confirm(`Delete stream "${name}" and all its articles?`)) return;

            const tx1 = db.transaction(["sources"], "readwrite");
            tx1.objectStore("sources").delete(id);

            await new Promise(res => tx1.oncomplete = res);
            await clearArticlesForSource(id);

            renderSourceList();
            initializeApp();
        }

        function clearArticlesForSource(sourceId) {
            return new Promise((resolve) => {
                const tx = db.transaction(["articles"], "readwrite");
                const store = tx.objectStore("articles");
                const index = store.index("sourceId");
                const request = index.openCursor(IDBKeyRange.only(sourceId));

                request.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        cursor.delete();
                        cursor.continue();
                    }
                };

                tx.oncomplete = () => resolve();
            });
        }

        // ---------- Fetching & Parsing ----------
        function syncSourcesAndFetch() {
            return new Promise((resolve) => {
                const tx = db.transaction(["sources"], "readonly");
                tx.objectStore("sources").getAll().onsuccess = async (e) => {
                    const sources = e.target.result;
                    const now = Date.now();
                    const oneHour = 60 * 60 * 1000;

                    for (const source of sources) {
                        if (now - source.lastChecked > oneHour || source.lastChecked === 0) {
                            await fetchSourceData(source);
                        }
                    }
                    resolve();
                };
            });
        }

        async function fetchSourceData(source) {
            try {
                const response = await fetch(`${AWS_API_ENDPOINT}?url=${encodeURIComponent(source.url)}`);
                const data = await response.json();
                const articles = parseArticles(data, source);

                const tx = db.transaction(["articles", "sources"], "readwrite");
                const artStore = tx.objectStore("articles");
                
                // Clear old articles for this source before adding fresh ones
                const index = artStore.index("sourceId");
                index.openCursor(IDBKeyRange.only(source.id)).onsuccess = (ev) => {
                    const cursor = ev.target.result;
                    if (cursor) {
                        cursor.delete();
                        cursor.continue();
                    }
                };

                articles.forEach(art => artStore.add(art));

                const srcStore = tx.objectStore("sources");
                source.lastChecked = Date.now();
                srcStore.put(source);

                await new Promise(res => tx.oncomplete = res);
            } catch (err) {
                console.error(`Failed to fetch source ${source.name}:`, err);
            }
        }

        function parseArticles(rawResponse, source) {
            if (!Array.isArray(rawResponse)) return [];

            const {
                id: sourceId,
                titleElement,
                descriptionElement,
                linkElement,
                thumbnailElement
            } = source;

            return rawResponse.slice(0, 10).map(item => ({
                sourceId,
                title: item[titleElement] || "Untitled",
                description: item[descriptionElement] || "",
                image: item[thumbnailElement] || "https://via.placeholder.com/300x150?text=NO+IMAGE",
                link: item[linkElement] || "#"
            }));
        }

        // ---------- Render feed ----------
        function renderInterleavedFeed() {
            if (!db) return;
            const tx = db.transaction(["sources", "articles"], "readonly");
            const sourceStore = tx.objectStore("sources");
            const articleStore = tx.objectStore("articles");

            sourceStore.getAll().onsuccess = (e) => {
                const sources = e.target.result;
                articleStore.getAll().onsuccess = (e) => {
                    const allArticles = e.target.result;
                    
                    const grouped = {};
                    sources.forEach(s => grouped[s.id] = []);
                    allArticles.forEach(art => {
                        if (grouped[art.sourceId]) grouped[art.sourceId].push(art);
                    });

                    const interleaved = [];
                    const maxLength = Math.max(...Object.values(grouped).map(arr => arr.length), 0);

                    for (let i = 0; i < maxLength; i++) {
                        sources.forEach(s => {
                            if (grouped[s.id][i]) {
                                interleaved.push({ ...grouped[s.id][i], sourceName: s.name });
                            }
                        });
                    }

                    const container = document.getElementById('feed-container');
                    container.innerHTML = "";
                    
                    if (interleaved.length === 0) {
                        container.innerHTML = `<div class="empty-list" style="grid-column: 1/-1;">System buffer empty. Add a stream using System Commands.</div>`;
                        return;
                    }

                    interleaved.forEach(art => {
                        const card = document.createElement('div');
                        card.className = "news-card";
                        
                        // Clean up text entities and strip HTML tags from snippet preview
                        const cleanTitle = decodeHtmlEntities(art.title);
                        const rawDesc = decodeHtmlEntities(art.description).replace(/<[^>]*>?/gm, '');
                        const shortDesc = rawDesc.substring(0, 100);

                        card.innerHTML = `
                            <span class="source-tag">[SOURCE: ${escapeHtml(art.sourceName)}]</span>
                            <img src="${art.image}" alt="Thumbnail" onerror="this.src='https://via.placeholder.com/300x150?text=ERROR'">
                            <h3><a href="${art.link}" target="_blank">${escapeHtml(cleanTitle)}</a></h3>
                            <p>${escapeHtml(shortDesc)}...</p>
                        `;
                        container.appendChild(card);
                    });
                };
            };
        }

        // ---------- Decoders & Sanitizers ----------
        function decodeHtmlEntities(str) {
            if (!str) return "";
            const parser = new DOMParser();
            const dom = parser.parseFromString(`<!doctype html><body>${str}`, 'text/html');
            return dom.body.textContent;
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
