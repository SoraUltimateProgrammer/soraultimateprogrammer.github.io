<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Information CPU</title>
    <style>
        :root {
            --hud-blue: #00f3ff;
            --hud-bg: #030a14;
            --hud-panel: rgba(0, 243, 255, 0.05);
            --hud-border: rgba(0, 243, 255, 0.3);
            --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        body {
            background-color: var(--hud-bg);
            color: var(--hud-blue);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--hud-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-shadow: var(--text-glow);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            animation: titleGlow 2.5s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow:
                    0 0 5px rgba(0, 243, 255, 0.35),
                    0 0 10px rgba(0, 243, 255, 0.25);
            }
            50% {
                text-shadow:
                    0 0 10px rgba(0, 243, 255, 0.8),
                    0 0 25px rgba(0, 243, 255, 0.65),
                    0 0 40px rgba(0, 243, 255, 0.4);
            }
        }

        p.subtitle { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.8; }

        /* Dropdown Menu Container */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .hud-btn {
            background: var(--hud-panel);
            border: 1px solid var(--hud-blue);
            color: var(--hud-blue);
            padding: 10px 16px;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: var(--hud-blue);
            color: var(--hud-bg);
            box-shadow: var(--text-glow);
        }

        .dropdown-content {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            background-color: var(--hud-bg);
            border: 1px solid var(--hud-border);
            box-shadow: 0px 8px 16px rgba(0, 243, 255, 0.2);
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scaleY(0.9);
            transform-origin: top;
            transition:
                opacity 0.2s ease,
                transform 0.25s ease,
                visibility 0.25s ease;
        }

        .dropdown-content button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            color: var(--hud-blue);
            padding: 12px 16px;
            font-family: inherit;
            cursor: pointer;
            transition:
                background 0.15s ease,
                padding-left 0.15s ease,
                box-shadow 0.15s ease;
        }

        .dropdown-content button:hover {
            background: var(--hud-panel);
            padding-left: 22px;
            box-shadow:
                inset 3px 0 0 var(--hud-blue),
                0 0 10px rgba(0, 243, 255, 0.15);
        }

        .dropdown.active .dropdown-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scaleY(1);
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 10, 20, 0.85);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--hud-bg);
            border: 1px solid var(--hud-blue);
            margin: 8% auto;
            padding: 20px;
            width: 90%;
            max-width: 480px;
            box-shadow: var(--text-glow);
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-modal {
            color: var(--hud-blue);
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover { opacity: 0.7; }

        .modal-content input,
        .modal-content button.submit-btn {
            width: 100%;
            box-sizing: border-box;
            background: transparent;
            border: 1px solid var(--hud-blue);
            color: var(--hud-blue);
            padding: 10px;
            margin: 8px 0;
            font-family: inherit;
            outline: none;
        }

        .modal-content label {
            display: block;
            font-size: 0.75rem;
            opacity: 0.75;
            margin-top: 10px;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .modal-content button.submit-btn:hover {
            background: var(--hud-blue);
            color: var(--hud-bg);
            box-shadow: var(--text-glow);
            cursor: pointer;
        }

        /* Feed Grid Styling */
        #feed-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            flex: 1;
        }

        .news-card {
            background: var(--hud-panel);
            border: 1px solid var(--hud-border);
            padding: 15px;
            transition: all 0.3s ease;
        }

        .news-card:hover {
            border-color: var(--hud-blue);
            box-shadow: var(--text-glow);
        }

        .news-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid var(--hud-border);
            margin-bottom: 10px;
        }

        .news-card h3 {
            font-size: 1rem;
            margin: 0 0 10px 0;
        }

        .news-card a {
            color: var(--hud-blue);
            text-decoration: none;
        }

        .news-card a:hover {
            text-decoration: underline;
        }

        .source-tag {
            font-size: 0.75rem;
            opacity: 0.7;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        /* Footer */
        footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid var(--hud-border);
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>THE INFORMATION CPU</h1>
            <p class="subtitle">[SYSTEM STATUS: ONLINE // PROTOCOL: DEFAULT]</p>
        </div>
        
        <div class="dropdown" id="control-dropdown">
            <button class="hud-btn" onclick="toggleDropdown()">SYSTEM COMMANDS ▼</button>
            <div class="dropdown-content">
                <button onclick="openModal()">+ Add New Stream</button>
                <button onclick="alert('Module offline: Modify streams coming soon.')">⚙ Modify Streams</button>
                <button onclick="alert('Module offline: QR import coming soon.')">📷 Import via QR</button>
            </div>
        </div>
    </header>

    <div id="stream-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3>// INITIALIZE NEW STREAM</h3>
            <form id="source-form">
                <label>Source Name</label>
                <input type="text" id="source-name" placeholder="e.g., TechCrunch" required>

                <label>API / Feed URL</label>
                <input type="url" id="source-url" placeholder="API/Feed GET Request URL" required>

                <label>Title Element</label>
                <input type="text" id="title-element" placeholder="e.g., title" required>

                <label>Description Element</label>
                <input type="text" id="description-element" placeholder="e.g., description" required>

                <label>Link Element</label>
                <input type="text" id="link-element" placeholder="e.g., link or url" required>

                <label>Thumbnail Element</label>
                <input type="text" id="thumbnail-element" placeholder="e.g., image or thumbnail" required>

                <button type="submit" class="submit-btn">EXECUTE STREAM LINK</button>
            </form>
        </div>
    </div>

    <div id="feed-container"></div>

    <footer>
        [CURRENT VERSION: ALPHA-3]
    </footer>

    <script>
        const AWS_API_ENDPOINT = "YOUR_API_GATEWAY_URL_HERE";
        let db;

        // UI Handlers for Dropdown & Modal
        function toggleDropdown() {
            document.getElementById('control-dropdown').classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.hud-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('active')) {
                        openDropdown.classList.remove('active');
                    }
                }
            }
        }

        function openModal() {
            document.getElementById('stream-modal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('stream-modal').style.display = "none";
        }

        // IndexedDB Initialization
        const request = indexedDB.open("InformationCPUDB", 1);
        
        request.onerror = (event) => console.error("IndexedDB error:", event.target.error);
        
        request.onsuccess = (event) => {
            db = event.target.result;
            initializeApp();
        };

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains("sources")) {
                db.createObjectStore("sources", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("articles")) {
                const articleStore = db.createObjectStore("articles", { keyPath: "id", autoIncrement: true });
                articleStore.createIndex("sourceId", "sourceId", { unique: false });
            }
        };

        async function initializeApp() {
            await syncSourcesAndFetch();
            renderInterleavedFeed();
        }

        // Handle Form Submission
        document.getElementById('source-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('source-name').value.trim();
            const url = document.getElementById('source-url').value.trim();
            const titleElement = document.getElementById('title-element').value.trim();
            const descriptionElement = document.getElementById('description-element').value.trim();
            const linkElement = document.getElementById('link-element').value.trim();
            const thumbnailElement = document.getElementById('thumbnail-element').value.trim();

            const transaction = db.transaction(["sources"], "readwrite");
            const store = transaction.objectStore("sources");

            store.add({
                name,
                url,
                titleElement,
                descriptionElement,
                linkElement,
                thumbnailElement,
                lastChecked: 0
            });

            transaction.oncomplete = () => {
                document.getElementById('source-form').reset();
                closeModal();
                initializeApp();
            };
        });

        // 1-hour freshness logic and AWS backend interaction
        function syncSourcesAndFetch() {
            return new Promise((resolve) => {
                const transaction = db.transaction(["sources"], "readonly");
                const store = transaction.objectStore("sources");
                const request = store.getAll();

                request.onsuccess = async () => {
                    const sources = request.result;
                    const now = Date.now();
                    const oneHour = 60 * 60 * 1000;

                    for (const source of sources) {
                        if (now - source.lastChecked > oneHour) {
                            await fetchSourceData(source);
                        }
                    }
                    resolve();
                };
            });
        }

        async function fetchSourceData(source) {
            try {
                const response = await fetch(`${AWS_API_ENDPOINT}?url=${encodeURIComponent(source.url)}`);
                const data = await response.json();
                const articles = parseArticles(data, source);

                const tx = db.transaction(["articles", "sources"], "readwrite");
                const artStore = tx.objectStore("articles");
                
                articles.forEach(art => artStore.add(art));

                const srcStore = tx.objectStore("sources");
                source.lastChecked = Date.now();
                srcStore.put(source);

                await new Promise((res) => tx.oncomplete = res);
            } catch (err) {
                console.error(`Failed to fetch source ${source.name}:`, err);
            }
        }

        function parseArticles(rawResponse, source) {
            if (!Array.isArray(rawResponse)) return [];

            const {
                id: sourceId,
                titleElement,
                descriptionElement,
                linkElement,
                thumbnailElement
            } = source;

            return rawResponse.slice(0, 10).map(item => ({
                sourceId,
                title: item[titleElement] || "Untitled",
                description: item[descriptionElement] || "",
                image: item[thumbnailElement] || "https://via.placeholder.com/300x150?text=NO+IMAGE",
                link: item[linkElement] || "#"
            }));
        }

        // Interleaving Sources (ABCABC pattern)
        function renderInterleavedFeed() {
            const tx = db.transaction(["sources", "articles"], "readonly");
            const sourceStore = tx.objectStore("sources");
            const articleStore = tx.objectStore("articles");

            sourceStore.getAll().onsuccess = (e) => {
                const sources = e.target.result;
                articleStore.getAll().onsuccess = (e) => {
                    const allArticles = e.target.result;
                    
                    const grouped = {};
                    sources.forEach(s => grouped[s.id] = []);
                    allArticles.forEach(art => {
                        if (grouped[art.sourceId]) grouped[art.sourceId].push(art);
                    });

                    const interleaved = [];
                    let maxLength = Math.max(...Object.values(grouped).map(arr => arr.length), 0);

                    for (let i = 0; i < maxLength; i++) {
                        sources.forEach(s => {
                            if (grouped[s.id][i]) {
                                interleaved.push({ ...grouped[s.id][i], sourceName: s.name });
                            }
                        });
                    }

                    const container = document.getElementById('feed-container');
                    container.innerHTML = "";
                    
                    interleaved.forEach(art => {
                        const card = document.createElement('div');
                        card.className = "news-card";
                        card.innerHTML = `
                            <span class="source-tag">[SOURCE: ${art.sourceName}]</span>
                            <img src="${art.image}" alt="Thumbnail" onerror="this.src='https://via.placeholder.com/300x150?text=ERROR'">
                            <h3><a href="${art.link}" target="_blank">${art.title}</a></h3>
                            <p>${(art.description || "").substring(0, 100)}...</p>
                        `;
                        container.appendChild(card);
                    });
                };
            };
        }
    </script>
</body>
</html>
